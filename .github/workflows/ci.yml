name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy lint gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test suite (content, WCAG, HTTP, budgets, privacy, SHA pins)
        run: cargo test --workspace --locked

      - name: WASM CSR, Hydrate & Release Budget checks
        run: |
          cargo check -p site-app --no-default-features --features csr --target wasm32-unknown-unknown --locked
          cargo check -p site-app --no-default-features --features hydrate --target wasm32-unknown-unknown --locked
          cargo build --profile wasm-release --locked -p site-app --no-default-features --features hydrate --target wasm32-unknown-unknown
          cargo test --workspace --locked --test release_and_privacy_gates
